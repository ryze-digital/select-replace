<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Replace Demo</title>
    <link rel="stylesheet" href="build/demo.css">
</head>
<body>
<div class="wrapper">
    <form>
        <div>
            <label for="select-replace">Single Select</label>
            <select id="select-replace">
                <option value="">Please select …</option>
                <option value="option-1">Option 1</option>
                <option value="option-2">Option 2</option>
                <option value="option-3">Option 3</option>
                <option value="option-4">Option 4</option>
                <option value="option-5">Option 5</option>
            </select>
        </div>
    </form>
</div>
<script type="module">
    import { SelectReplace } from './build/demo.js';

    const selectField = document.querySelector('select');
    const selectReplace = new SelectReplace({
        el: selectField
    });

    selectField.addEventListener('beforeDestroy', (event) => {
        console.log('beforeDestroy');
    });

    selectField.addEventListener('afterDestroy', (event) => {
        console.log('afterDestroy');
    });

    selectReplace.init();

    window.setTimeout(() => {
        selectReplace.destroy();
    }, 5000);
</script>

</body>
</html>
